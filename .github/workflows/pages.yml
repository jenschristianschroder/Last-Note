name: Deploy The Last Note to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check game modules and test the score
        run: |
          for module in game/*.mjs; do node --check "$module"; done
          node --test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: game

  deploy:
    needs: check-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
