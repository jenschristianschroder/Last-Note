name: Deploy The Last Note to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check game modules and test the score
        run: |
          for module in game/*.mjs; do node --check "$module"; done
          node --test
      - name: Version local asset URLs for this release
        shell: python
        run: |
          import os
          from pathlib import Path

          game = Path("game")
          revision = os.environ["GITHUB_SHA"][:12]
          modules = sorted(game.glob("*.mjs"))
          assets = [*modules, game / "style.css", *sorted((game / "fonts").glob("*.woff2"))]
          for source in [game / "index.html", game / "style.css", *modules]:
              text = source.read_text()
              for asset in assets:
                  url = "./" + asset.relative_to(game).as_posix()
                  text = text.replace(url, url + "?v=" + revision)
              source.write_text(text)
      - uses: actions/upload-pages-artifact@v4
        with:
          path: game

  deploy:
    needs: check-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the game
        id: deployment
        uses: actions/deploy-pages@v4
